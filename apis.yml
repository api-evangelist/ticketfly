name: Ticketfly
description: 'Ticketfly was a San Francisco-based event-ticketing platform for independent music venues,
  promoters, and festivals, founded in 2008. It was acquired by Eventbrite in 2017 and, following a June
  2018 data breach, was shut down in November 2018 with its music-oriented features folded into Eventbrite
  Music. The company is defunct: as of 2026 every Ticketfly host (www.ticketfly.com, developer.ticketfly.com)
  returns HTTP 301 redirects to eventbrite.com. No independent Ticketfly API, developer portal, documentation,
  or specification survives. This profile is retained as a historical/acquired-company record; there is no
  live API surface to enrich.'
